services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - towerdef-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name towerdef-local
        --database.address postgres:localdb@postgres:5432/nakama
        --runtime.js_entrypoint index.js
        --logger.level INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dist/nakama:/nakama/data/modules:ro
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7352:7351"
volumes:
  towerdef-data:
